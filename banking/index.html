<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Chrome, Firefox OS and Opera -->
  <meta name="theme-color" content="#0089FF">
  <!-- Windows Phone -->
  <meta name="msapplication-navbutton-color" content="#0089FF">
  <!-- iOS Safari -->
  <meta name="apple-mobile-web-app-status-bar-style" content="#0089FF">
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
  <meta content="utf-8" http-equiv="encoding">
  <meta name="author" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="shortcut icon" href="{{ favicon or " /assets/frappe/images/frappe-favicon.svg" }}" type="image/x-icon">
  <link rel="icon" href="{{ favicon or " /assets/frappe/images/frappe-favicon.svg" }}" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Inter:wght@100..900&display=swap"
    rel="stylesheet">
  <title>Banking | {{ app_name }}</title>
</head>

<body>
  <div id="root"></div>
  <script>window.csrf_token = '{{ frappe.session.csrf_token }}';
    if (!window.frappe) window.frappe = {};

    frappe.boot = JSON.parse({{ boot }});
    frappe._messages = frappe.boot["__messages"];
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
