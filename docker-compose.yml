version: '3.8'

services:
  erpnext:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456
      - SITE_NAME=erp.localhost
      - ADMIN_PASSWORD=admin123
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
