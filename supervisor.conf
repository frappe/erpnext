[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

# ============================================================================
# Frappe Worker - Long Queue
# ============================================================================
[program:frappe-worker-long]
command=bench worker --queue long
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=5
stdout_logfile=/app/logs/worker-long.log
stderr_logfile=/app/logs/worker-long-error.log
environment=FRAPPE_BENCH_PATH=/app

# ============================================================================
# Frappe Worker - Default Queue
# ============================================================================
[program:frappe-worker-default]
command=bench worker --queue default
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=5
stdout_logfile=/app/logs/worker-default.log
stderr_logfile=/app/logs/worker-default-error.log
environment=FRAPPE_BENCH_PATH=/app

# ============================================================================
# Frappe Worker - Short Queue
# ============================================================================
[program:frappe-worker-short]
command=bench worker --queue short
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=5
stdout_logfile=/app/logs/worker-short.log
stderr_logfile=/app/logs/worker-short-error.log
environment=FRAPPE_BENCH_PATH=/app

# ============================================================================
# Frappe Scheduler
# ============================================================================
[program:frappe-scheduler]
command=bench schedule
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=5
stdout_logfile=/app/logs/scheduler.log
stderr_logfile=/app/logs/scheduler-error.log
environment=FRAPPE_BENCH_PATH=/app

# ============================================================================
# Group Configuration
# ============================================================================
[group:frappe]
programs=frappe-worker-long,frappe-worker-default,frappe-worker-short,frappe-scheduler