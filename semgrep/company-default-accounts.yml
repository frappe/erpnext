rules:
- id: company-default-account-field-removed
  patterns:
  - pattern-either:
    - pattern: frappe.get_cached_value("Company", $COMPANY, $FIELD, ...)
    - pattern: frappe.get_value("Company", $COMPANY, $FIELD, ...)
    - pattern: frappe.db.get_value("Company", $COMPANY, $FIELD, ...)
    - pattern: frappe.set_value("Company", $COMPANY, $FIELD, ...)
    - pattern: frappe.db.set_value("Company", $COMPANY, $FIELD, ...)
    - pattern: frappe.get_cached_value("Company", $COMPANY, [..., $FIELD, ...], ...)
    - pattern: frappe.get_value("Company", $COMPANY, [..., $FIELD, ...], ...)
    - pattern: frappe.db.get_value("Company", $COMPANY, [..., $FIELD, ...], ...)
    - pattern: |
        frappe.db.set_value("Company", $COMPANY, {..., $FIELD: $VALUE, ...}, ...)
    - pattern: get_company_default($COMPANY, $FIELD, ...)
    - pattern: $MODULE.get_company_default($COMPANY, $FIELD, ...)
  - metavariable-regex:
      metavariable: $FIELD
      regex: ^["'](default_bank_account|default_cash_account|default_receivable_account|default_payable_account|default_expense_account|default_income_account|round_off_account|round_off_for_opening|write_off_account|bank_charges_account|exchange_gain_loss_account|exchange_gain_account|exchange_loss_account|unrealized_exchange_gain_loss_account|unrealized_profit_loss_account|default_discount_account|default_deferred_revenue_account|default_deferred_expense_account|default_inventory_account|stock_adjustment_account|stock_received_but_not_billed|stock_delivered_but_not_billed|default_purchase_price_variance_account|default_manufacturing_variance_account|default_provisional_account|default_advance_received_account|default_advance_paid_account|default_operating_cost_account|purchase_expense_account|purchase_expense_contra_account|service_expense_account|expenses_added_to_stock_account|expenses_added_to_stock_contra_account|accumulated_depreciation_account|depreciation_expense_account|disposal_account|capital_work_in_progress_account|asset_received_but_not_billed)["']$
  message: |
    The Company field $FIELD was removed in v17. Company default accounts are rows of the
    child table "default_accounts" now. Use erpnext.accounts.default_accounts.get_default_account(company, PURPOSE)
    to read and set_default_account(company, PURPOSE, account) to write.
  paths:
    exclude:
    - "**/patches/**"
  languages: [python]
  severity: ERROR
