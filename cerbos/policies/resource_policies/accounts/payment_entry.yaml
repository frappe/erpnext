# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: payment_entry
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resources/payment_entry.json
  importDerivedRoles:
    - erpnext_common_roles
  variables:
    import:
      - erpnext_common_vars
  rules:
    - actions: ["create", "read", "write", "delete", "submit", "cancel", "amend", "print", "email", "export", "share", "report"]
      effect: EFFECT_ALLOW
      roles: ["System Manager"]
      condition:
        match:
          expr: V.is_in_company

    - actions: ["create", "read", "write", "submit", "cancel", "amend", "print", "email", "export", "share", "report"]
      effect: EFFECT_ALLOW
      roles: ["Accounts Manager"]
      condition:
        match:
          expr: V.is_in_company

    - actions: ["create", "read", "write", "submit", "cancel", "amend", "print", "email", "export", "report"]
      effect: EFFECT_ALLOW
      roles: ["Accounts User"]
      condition:
        match:
          expr: V.is_in_company

    # Region lock: deletion blocked for submitted/cancelled in Nepal.
    - actions: ["delete"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: V.region_locks_deletion
              - expr: R.attr.docstatus != 0

    - actions: ["write", "delete"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: V.is_submitted

    - actions: ["submit", "cancel"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: V.is_cancelled

    - actions: ["amend"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: "!V.is_cancelled"
