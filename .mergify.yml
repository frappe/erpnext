shared:
  pr_checks: &pr_checks
    - base~=^(develop|version-15-hotfix|version-16-hotfix)$
    - label!=dont-merge
    - check-success=linters
    - check-success=Check Commit Titles
  suite_checks: &suite_checks
    - check-success=Patch Test
    - check-success=Python Unit Tests (1)
    - check-success=Python Unit Tests (2)
    - check-success=Python Unit Tests (3)
    - check-success=Python Unit Tests (4)

pull_request_rules:
  - name: Auto-close PRs on stable branch
    conditions:
      - and:
          - and:
              - author!=surajshetty3416
              - author!=gavindsouza
              - author!=rohitwaghchaure
              - author!=nabinhait
              - author!=ankush
              - author!=deepeshgarg007
              - author!=frappe-pr-bot
              - author!=mergify[bot]
          - or:
              - base=version-13
              - base=version-12
              - base=version-14
              - base=version-15
              - base=version-16
    actions:
      close:
      comment:
        message: |
          @{{author}}, thanks for the contribution, but we do not accept pull requests on a stable branch. Please raise PR on an appropriate hotfix branch.
          https://github.com/frappe/erpnext/wiki/Pull-Request-Checklist#which-branch
  - name: backport to develop
    conditions:
      - label="backport develop"
    actions:
      backport:
        branches:
          - develop
        assignees:
          - "{{ author }}"
  - name: backport to version-14-hotfix
    conditions:
      - label="backport version-14-hotfix"
    actions:
      backport:
        branches:
          - version-14-hotfix
        assignees:
          - "{{ author }}"
  - name: backport to version-15-hotfix
    conditions:
      - label="backport version-15-hotfix"
    actions:
      backport:
        branches:
          - version-15-hotfix
        assignees:
          - "{{ author }}"
  - name: backport to version-16-hotfix
    conditions:
      - label="backport version-16-hotfix"
    actions:
      backport:
        branches:
          - version-16-hotfix
        assignees:
          - "{{ author }}"
  - name: Merge PRs tested alone
    conditions:
      - label=merge-alone
      - "#approved-reviews-by>=1"
      - and: *pr_checks
      - and: *suite_checks
    actions:
      merge:
        method: merge

queue_rules:
  - name: default
    batch_size: 5
    batch_max_wait_time: 30 min
    max_checks_retries: 1
    merge_method: merge
    queue_conditions:
      - label!=merge-alone
      - and: *pr_checks
    merge_conditions: *suite_checks

merge_queue:
  queue_controls_comment: false
  skip_intermediate_results: true
