name: Postgres ERP Test
on:
  push:
    branches:
      - pre-prod
  pull_request:
concurrency:
  group: postgres-erp-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test_site
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Clone Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache Dependencies (PIP)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache Dependencies (Yarn)
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: ~/.yarn-cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-server

      - name: Install Frappe Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path https://github.com/8848digital/frappe --frappe-branch pre-prod ~/frappe-bench

      - name: Install Apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext https://github.com/8848digital/erpnext.git --branch pre-prod
          bench get-app https://Satya8848:${{secrets.GH_PAT}}@github.com/8848digital/ERPNext-India.git --branch pre-prod
          bench get-app https://github.com/8848digital/india_compliance.git --branch pre-prod
          bench get-app https://github.com/8848digital/Assets --branch pre-prod
          bench get-app https://Satya8848:${{secrets.GH_PAT}}@github.com/8848digital/CRM --branch pre-prod
          bench get-app https://Satya8848:${{secrets.GH_PAT}}@github.com/8848digital/projects.git --branch pre-prod
          bench get-app https://Satya8848:${{secrets.GH_PAT}}@github.com/8848digital/sales_commission.git --branch pre-prod
          bench get-app --branch version-15 payments
          bench setup requirements --dev

      - name: Create Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-type postgres --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext erpnext_india assets erpnext_crm projects payments sales_commission india_compliance
          bench --site test_site migrate

      - name: Set Permissions & Configs
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site set-config developer_mode 1
          bench --site test_site set-config db_host localhost
          bench --site test_site set-config admin_password admin

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          set +e
          bench --site test_site run-tests --app erpnext --coverage --junit-xml-output /home/runner/frappe-bench/test_results.xml 2>&1 | tee test_output.log
          echo "Tests completed, proceeding..."

      # ✅ Updated Step Starts Here
      - name: Convert Test Results to CSV
        run: |
          pip install xmltodict pandas
          python <<EOF
          import xmltodict, pandas as pd, os

          xml_file = "/home/runner/frappe-bench/test_results.xml"
          csv_file = "/home/runner/frappe-bench/test_report.csv"

          if not os.path.exists(xml_file) or os.path.getsize(xml_file) == 0:
              df = pd.DataFrame([["No Tests Executed", "N/A", ""]], columns=["Test Name", "Status", "Traceback"])
              df.to_csv(csv_file, index=False)
              print("⚠️ No test results found. Created fallback CSV.")
              exit(0)

          text = open(xml_file).read().strip()
          if not text:
              df = pd.DataFrame([["No Tests Executed", "N/A", ""]], columns=["Test Name", "Status", "Traceback"])
              df.to_csv(csv_file, index=False)
              print("⚠️ XML empty. Created fallback CSV.")
              exit(0)

          data = xmltodict.parse(text)
          suites = data.get("testsuites", {}).get("testsuite", [])
          if isinstance(suites, dict): suites = [suites]

          results = []
          for s in suites:
              cases = s.get("testcase", [])
              if isinstance(cases, dict): cases = [cases]
              for c in cases:
                  name = c.get("@name", "Unknown")
                  err = c.get("error")
                  status = "Failed" if err else "Passed"
                  trace = err.get("#text", "") if err else ""
                  results.append([name, status, trace])

          pd.DataFrame(results, columns=["Test Name", "Status", "Traceback"]).to_csv(csv_file, index=False)
          print("✅ CSV report generated successfully.")
          EOF
      # ✅ Updated Step Ends Here

      - name: Upload CSV Test Report
        uses: actions/upload-artifact@v4
        with:
          name: csv-test-report
          path: /home/runner/frappe-bench/test_report.csv

      - name: Upload Coverage Data to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: /home/runner/frappe-bench/sites/coverage.xml
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Data as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: /home/runner/frappe-bench/sites/coverage.xml

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /home/runner/frappe-bench/test_output.log
