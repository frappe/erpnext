name: Publish Marketplace Release
on:
  release:
    types: [released]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'frappe/erpnext'
    uses: frappe/marketplace/.github/workflows/publish-release.yml@main
    with:
      app: erpnext
      branch: ${{ github.event.release.target_commitish || github.ref_name }}
      channel: ${{ github.ref_name == 'develop' && 'nightly' || 'stable' }}
    secrets:
      registry_token: ${{ secrets.MARKETPLACE_PR_TOKEN }}
