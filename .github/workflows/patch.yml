name: Patch

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: patch-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    if: >-
      (github.event_name != 'pull_request'
      || (github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/'))
      || (startsWith(github.base_ref, 'version-') && !endsWith(github.base_ref, '-hotfix')))
    runs-on: erpnext-arc-patch
    timeout-minutes: 60

    name: Patch Test

    container:
      image: ghcr.io/frappe/erpnext-ci-mariadb:py3.11-node18-mariadb11.8
      credentials:
        username: ${{ secrets.GHCR_USERNAME || github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}

    defaults:
      run:
        shell: bash

    env:
      ERPNEXT_CI_USER: ci
      CI_DB_DATADIR: /home/ci/db-ram/data
      PIP_CACHE_DIR: /home/ci/.cache/pip
      npm_config_cache: /home/ci/.cache/npm
      YARN_CACHE_FOLDER: /home/ci/.cache/yarn
      UV_CACHE_DIR: /home/ci/.cache/uv
      UV_LINK_MODE: copy

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | tee -a /etc/hosts

      - name: Start DB
        run: bash ${GITHUB_WORKSPACE}/.github/helper/start-db.sh
        env:
          SKIP_SYSTEM_SETUP: "1"

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: patch
          DB_HOST: 127.0.0.1
          DB_USER_HOST: '%'
          SKIP_SYSTEM_SETUP: "1"
          SKIP_WKHTMLTOX_SETUP: 1
          CI_SKIP_ERPNEXT_ASSETS: 1
          CI_GITHUB_TOKEN: ${{ github.token }}

      - name: Run Patch Tests
        run: |
          su -m "$ERPNEXT_CI_USER" -s /bin/bash <<'EOF'
          set -eo pipefail
          cd ~/frappe-bench/
          jq 'del(.install_apps)' ~/frappe-bench/sites/test_site/site_config.json > tmp.json
          mv tmp.json ~/frappe-bench/sites/test_site/site_config.json

          wget https://erpnext.com/files/v13-erpnext.sql.gz
          bench --site test_site --force restore ~/frappe-bench/v13-erpnext.sql.gz

          git -C "apps/frappe" remote set-url upstream https://github.com/frappe/frappe.git
          git -C "apps/erpnext" remote set-url upstream https://github.com/frappe/erpnext.git


          function update_to_version() {
            version=$1

            branch_name="version-$version-hotfix"
            echo "Updating to v$version"

            # Fetch and checkout branches
            git -C "apps/frappe" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/erpnext" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/frappe" checkout -q -f $branch_name
            git -C "apps/erpnext" checkout -q -f $branch_name

            # Resetup env and install apps
            pgrep honcho | xargs kill
            rm -rf ~/frappe-bench/env
            bench -v setup env --python python3.11
            bench pip install -e ./apps/erpnext
            bench start &>> ~/frappe-bench/bench_start.log &

            bench --site test_site migrate
          }

          update_to_version 14

          echo "Updating to latest version"
          git -C "apps/frappe" fetch --depth 1 upstream "${GITHUB_BASE_REF:-${GITHUB_REF##*/}}"
          git -C "apps/frappe" checkout -q -f FETCH_HEAD
          git -C "apps/erpnext" checkout -q -f "$GITHUB_SHA"

          pgrep honcho | xargs kill
          rm -rf ~/frappe-bench/env
          bench -v setup env --python python3.11
          bench pip install -e ./apps/erpnext
          bench start &>> ~/frappe-bench/bench_start.log &

          bench --site test_site migrate
          EOF

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cd ~/frappe-bench
          cat bench_start.log || true
          cd logs
          for f in ./*.log*; do
            echo "Printing log: $f";
            cat $f
          done
