name: Server (Mariadb)

on:
  repository_dispatch:
    types: [frappe-framework-change]
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.svg'
      - '**.md'
      - '**.html'
      - 'crowdin.yml'
      - '.coderabbit.yml'
      - '.mergify.yml'
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: 'Frappe Framework repository user (add your username for forks)'
        required: true
        default: 'frappe'
        type: string
      branch:
        description: 'Frappe Framework branch'
        default: 'develop'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: server-mariadb-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: 'Asia/Kolkata'
      NODE_ENV: "production"
      WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}

    strategy:
      fail-fast: false

      matrix:
        # 4 runners, each owning 2 shards (8 total builds).
        # Format per element: [[site_name, build_no, total_builds], ...]
        sites:
          - [["test_site_1", 1, 8], ["test_site_2", 2, 8]]
          # - [["test_site_3", 3, 8], ["test_site_4", 4, 8]]
          # - [["test_site_5", 5, 8], ["test_site_6", 6, 8]]
          # - [["test_site_7", 7, 8], ["test_site_8", 8, 8]]

    name: Python Unit Tests

    services:
      mysql:
        image: mariadb:10.6
        env:
          TZ: 'Asia/Kolkata'
          MARIADB_ROOT_PASSWORD: 'root'
          # Disable durability guarantees that are unnecessary in a throwaway CI container.
          # innodb_flush_log_at_trx_commit=0 avoids an fsync on every commit (biggest win).
          # sync_binlog=0 skips binary-log syncs; innodb_doublewrite=0 skips the doublewrite buffer.
          MARIADB_EXTRA_FLAGS: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --innodb-doublewrite=0
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Extract site variables
        run: |
          sites='${{ toJSON(matrix.sites) }}'
          echo "SITE1=$(echo "$sites"  | jq -r '.[0][0]')"        >> "$GITHUB_ENV"
          echo "BUILD1=$(echo "$sites" | jq -r '.[0][1]')"        >> "$GITHUB_ENV"
          echo "SITE2=$(echo "$sites"  | jq -r '.[1][0]')"        >> "$GITHUB_ENV"
          echo "BUILD2=$(echo "$sites" | jq -r '.[1][1]')"        >> "$GITHUB_ENV"
          echo "TOTAL_BUILDS=$(echo "$sites" | jq -r '.[0][2]')"  >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 ${{ env.SITE1 }}" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ${{ env.SITE2 }}" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache wkhtmltopdf
        uses: actions/cache@v4
        with:
          path: /tmp/wkhtmltox.deb
          key: wkhtmltox-0.12.6.1-2-jammy-amd64

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.client_payload.sha || github.event.inputs.branch }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          coverage_flag=""
          if [ "$WITH_COVERAGE" = "true" ]; then coverage_flag="--with-coverage"; fi

          bench --site "$SITE1" run-parallel-tests --lightmode --app erpnext \
            --total-builds "$TOTAL_BUILDS" \
            --build-number "$BUILD1" \
            $coverage_flag > test_output1.txt 2>&1 &
          pid1=$!
          bench --site "$SITE2" run-parallel-tests --lightmode --app erpnext \
            --total-builds "$TOTAL_BUILDS" \
            --build-number "$BUILD2" \
            $coverage_flag > test_output2.txt 2>&1 &
          pid2=$!

          exit1=0; exit2=0
          wait $pid1 || exit1=$?
          wait $pid2 || exit2=$?

          cat test_output1.txt
          cat test_output2.txt

          [ $exit1 -eq 0 ] && [ $exit2 -eq 0 ]
        env:
          TYPE: server


      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true

      - name: Upload coverage data (site1)
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.BUILD1 }}
          path: /home/runner/frappe-bench/sites/${{ env.SITE1 }}/coverage.xml

      - name: Upload coverage data (site2)
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.BUILD2 }}
          path: /home/runner/frappe-bench/sites/${{ env.SITE2 }}/coverage.xml

  coverage:
    name: Coverage Wrap Up
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          name: MariaDB
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
