name: Generate Semantic Release
on:
  push:
    branches:
      - version-13

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save
      - name: Get Frappe Release Bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FRAPPE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FRAPPE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Create Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "frappe-release-bot[bot]"
          GIT_AUTHOR_EMAIL: "346168705+frappe-release-bot[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "frappe-release-bot[bot]"
          GIT_COMMITTER_EMAIL: "346168705+frappe-release-bot[bot]@users.noreply.github.com"
        run: npx semantic-release
