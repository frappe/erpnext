name: Generate Semantic Release
on:
  push:
    branches:
      - version-16

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save
      - name: Get Frappe Release Bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FRAPPE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FRAPPE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Create Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "frappe-release-bot[bot]"
          GIT_AUTHOR_EMAIL: "346168705+frappe-release-bot[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "frappe-release-bot[bot]"
          GIT_COMMITTER_EMAIL: "346168705+frappe-release-bot[bot]@users.noreply.github.com"
        run: npx semantic-release
      - name: Comment on released pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch origin "$GITHUB_REF_NAME" --tags --force
          tag=$(git tag --points-at "origin/$GITHUB_REF_NAME" 'v*' | head -1)
          [ -n "$tag" ] || exit 0
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^")
          body=$(printf ':tada: This PR is included in version %s :tada:\n\nThe release is available on [GitHub release](%s)' \
            "${tag#v}" "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f previous_tag_name="$prev" --jq .body \
            | grep -oE "/$GITHUB_REPOSITORY/pull/[0-9]+" | grep -oE '[0-9]+$' | sort -un \
            | while read -r pr; do
                if gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '.[].name' | grep -qx released; then
                  continue
                fi
                gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" > /dev/null
                gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=released" > /dev/null
                sleep 2
              done
